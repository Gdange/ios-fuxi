name: Fuxi builds

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: Kernel/boot-argument profiles (current source, WLAN opt-in)
        type: choice
        options: [none, metal4, wlan6f, all]
        default: metal4
      metal:
        description: Signed FuxiMetal, smoke, own metallib and pinned metal2vulkan
        type: boolean
        default: false
      mesa:
        description: Pinned patched Turnip ICD with build recipes and patches
        type: boolean
        default: false
      tools:
        description: Signed Vulkan probe/smoke and GPU ABI test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: targets
        env:
          KERNEL: ${{ inputs.kernel }}
          METAL: ${{ inputs.metal }}
          MESA: ${{ inputs.mesa }}
          TOOLS: ${{ inputs.tools }}
        run: |
          matrix=$(bash tools/ci/build.sh --plan "$KERNEL" "$METAL" "$MESA" "$TOOLS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.target }}
    # Xcode 15 iig matches XNU 8796's IORPC ABI; never silently use Xcode 16.
    # macos-14 retirement is tracked in xnu/README.md.
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Download caches contain public source snapshots, text patches and GNU
      # Bison source only. Never cache KDKs, SDKs, build trees or research/.
      - uses: actions/cache@v4
        with:
          path: deps/ci-downloads
          key: fuxi-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('tools/ci/pins.env', 'tools/ci/build.sh') }}
      - uses: actions/cache@v4
        with:
          path: deps/ci-brew
          key: fuxi-brew-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('tools/ci/pins.env', 'tools/ci/build.sh') }}
      - uses: actions/cache@v4
        if: matrix.target == 'metal'
        with:
          path: |
            ~/.cargo/registry
          key: fuxi-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/pins.env', 'tools/fuxi-metal2vulkan-bridge.rs', 'tools/build-fuxi-metal-translator.sh') }}
      - name: Build selected target (no boot-image packing)
        run: bash tools/ci/build.sh "$TARGET"
      - name: Upload target outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-${{ matrix.target }}
          path: tools/out/ci/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
